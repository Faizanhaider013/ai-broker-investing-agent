name: Native Wrapper CI

# Fast correctness check for apps/ai-broker-native-wrapper on every push/PR that
# touches it (or the auth code its OAuth handoff depends on) — a Rust
# `cargo check` plus a debug build, no bundling/signing/release. The full
# 5-platform release build lives in native-wrapper-release.yml and only runs
# on a version tag; running that on every push would cost ~15 CPU-minutes of
# Rust compilation per commit for no benefit.

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-broker-native-wrapper/**"
      - "apps/ai-broker-web/lib/auth/**"
      - "apps/ai-broker-web/lib/native/**"
      - "apps/ai-broker-web/app/auth/**"
  pull_request:
    paths:
      - "apps/ai-broker-native-wrapper/**"
      - "apps/ai-broker-web/lib/auth/**"
      - "apps/ai-broker-web/lib/native/**"
      - "apps/ai-broker-web/app/auth/**"

concurrency:
  group: native-wrapper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-configuration:
    name: Profile matches checked-in config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # scripts/configure.mjs is the one place that understands
      # profiles/<name>.json -> tauri.conf.json. Regenerating from the
      # default profile and diffing against what's checked in catches the
      # case where someone hand-edited tauri.conf.json (or
      # generated_scheme.rs) without updating its profile, which would
      # silently drift the two apart.
      - name: Regenerate from profiles/ai-broker.json and diff
        working-directory: apps/ai-broker-native-wrapper
        run: |
          node scripts/configure.mjs
          git diff --exit-code -- src-tauri/tauri.conf.json src-tauri/src/generated_scheme.rs src-tauri/Info.plist dist/splash-config.js || {
            echo "::error::src-tauri/tauri.conf.json or generated_scheme.rs is out of date with profiles/ai-broker.json — run 'bun run configure' in apps/ai-broker-native-wrapper and commit the result." >&2
            exit 1
          }

  cargo-check:
    name: cargo check (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ai-broker-native-wrapper/src-tauri

      - name: cargo check
        working-directory: apps/ai-broker-native-wrapper/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: apps/ai-broker-native-wrapper/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/ai-broker-native-wrapper/src-tauri
        run: cargo test
